name: POWER RADIO Vormittag Produktion
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
  push:
    paths: ['.github/workflows/vormittag-full.yml', 'radio/vormittag-edition.json']
permissions:
  contents: read
concurrency:
  group: power-vormittag-full
  cancel-in-progress: true
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts
      - name: Produce and verify pilot
        env:
          LAUTFM_TOKEN: ${{ secrets.LAUTFM_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,subprocess,time,datetime,random,uuid
          from zoneinfo import ZoneInfo
          now=datetime.datetime.now(ZoneInfo('Europe/Berlin'))
          day=now.date().isoformat()
          if now.hour>=10: raise SystemExit('Production window closed; existing schedule preserved')
          base='/stations/1687'
          token=os.environ['LAUTFM_TOKEN']
          def api(path,method='GET',body=None):
              req=urllib.request.Request('https://api.radioadmin.laut.fm'+path,method=method,data=json.dumps(body).encode() if body is not None else None,headers={'Authorization':'Bearer '+token,'Origin':'LautfmMCP','Accept':'application/json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
                  return json.loads(raw) if raw else None
          def records(o):
              if isinstance(o,dict):
                  yield o
                  for v in o.values(): yield from records(v)
              elif isinstance(o,list):
                  for v in o: yield from records(v)
          title='POWER RADIO – Der Vormittag '+day+' (Redaktion 2)'
          def playlists():
              return [x for x in records(api(base+'/playlists')) if x.get('title')==title and x.get('id')]
          if playlists(): raise SystemExit('Dated edition already exists; inspect it before retrying')
          import re,unicodedata,urllib.parse
          edition=json.load(open('radio/vormittag-edition.json',encoding='utf-8'))
          assert edition['date']==day, 'Missing fresh daily editorial input; existing schedule preserved'
          def track(tid):
              matches=[x for x in records(api(base+'/tracks/'+str(tid))) if x.get('id')==tid and 'duration' in x]
              assert len(matches)==1,'Track metadata ambiguous'
              return matches[0]
          def norm(v):
              return ''.join(c for c in unicodedata.normalize('NFKD',str(v)).casefold() if c.isalnum())
          def identity(x):
              artist=re.split(r'\s+(?:feat\.?|ft\.?)\s+',str(x.get('artist','')),flags=re.I)[0]
              title=re.sub(r'\s*\((?:radio edit|single edit|original mix)\)\s*','',str(x.get('title','')),flags=re.I)
              return norm(artist),norm(title)
          def key(x): return (norm(x.get('artist','')),norm(x.get('title','')))
          originalkeys={identity(dict(artist=a,title=t)) for a,t in edition['original_artist_pairs']}
          def valid(x):
              return isinstance(x.get('id'),int) and x['id']>1 and x.get('type')=='song' and 100<=x.get('duration',0)<=480 and all(key(x)) and not any(g in str(x.get('genre','')).lower() for g in ('schlager','volksmusik','ballermann')) and not any(v in str(x.get('title','')).lower() for v in ('karaoke','tribute','cover version','live version','sped up','slowed'))
          all_lists=list(records(api(base+'/playlists')))
          previous=[p for p in all_lists if isinstance(p.get('id'),int) and str(p.get('title','')).startswith('POWER RADIO – Der Vormittag ') and re.search(r'\d{4}-\d{2}-\d{2}',p['title']) and re.search(r'\d{4}-\d{2}-\d{2}',p['title']).group()<day]
          previous.sort(key=lambda p:p['title'],reverse=True)
          previous_id=previous[0]['id'] if previous else 556384
          prior=api(base+'/playlists/'+str(previous_id))
          prior_ids=list(dict.fromkeys(e['track_id'] for e in prior['entries']))
          old=[]
          for tid in prior_ids:
              x=track(tid)
              if valid(x) and identity(x) in originalkeys and identity(x) not in {identity(y) for y in old}: old.append(x)
          assert len(old)>=30,'Yesterday music baseline unavailable'
          oldkeys={identity(x) for x in old}
          chartkeys={tuple(norm(v) for v in pair) for pair in edition['current_chart_candidates']}
          fresh=[]
          # Search the entire station library by exact artist/title, every daily run.
          for artist,song in edition['candidates']:
              q=urllib.parse.urlencode(dict(artist=artist,title=song,type='song'))
              matches=[x for x in records(api(base+'/tracks?'+q)) if valid(x) and key(x)==(norm(artist),norm(song))]
              if not matches: continue
              x=sorted(matches,key=lambda t:t['id'])[0]
              # Resolve the ID again: search results alone are not playability evidence.
              x=track(x['id'])
              if valid(x) and key(x)==(norm(artist),norm(song)) and identity(x) not in oldkeys|{identity(t) for t in fresh}:
                  fresh.append(x)
          print('LIBRARY SEARCH VERIFIED',len(edition['candidates']),'queries;',len(fresh),'new exact playable matches; baseline',previous_id,len(old))
          assert len(fresh)>=20,'Not enough verified new library titles; existing programme retained'
          assert len(edition['moderations'])==30 and len(set(edition['moderations']))==30
          scripts=[('de-DE-ConradNeural' if i%2==0 else 'de-DE-KatjaNeural',v) for i,v in enumerate(edition['moderations'])]
          mods=[]
          reuse=edition.get('reuse_moderations',[])
          if reuse:
              assert len(reuse)==30 and edition.get('reuse_verified_run')==46115429367
              for tid in reuse:
                  x=track(tid)
                  assert x.get('private') is True and x.get('type')=='moderation' and x.get('artist')=='POWER RADIO' and x['duration']>0
                  mods.append(tid)
              print('REUSED VERIFIED DAILY MODERATIONS',len(mods))
          for i,(voice,script) in enumerate(scripts if not reuse else []):
              f=f'moderation-{day}-{uuid.uuid4().hex}-{i}.mp3'
              subprocess.run(['edge-tts','--voice',voice,'--rate=+5%','--text',script,'--write-media',f],check=True)
              raw=subprocess.check_output(['curl','--silent','--show-error','--fail-with-body','--max-time','120','-H','Authorization: Bearer '+token,'-H','Origin: LautfmMCP','-H','Accept: application/json','-F',f'track=@{f};type=audio/mpeg','-F','private=true','https://api.radioadmin.laut.fm'+base+'/tracks'])
              pending=int(json.loads(raw)['id'])
              tid=None
              for _ in range(90):
                  try:
                      found=[x['id'] for x in records(api(base+'/tracks/'+str(pending))) if isinstance(x.get('id'),int) and x['id']>0 and x.get('private') is True and x.get('duration',0)>0]
                      if len(set(found))==1: tid=found[0];break
                  except Exception: pass
                  time.sleep(10)
              if tid is None: raise SystemExit('Upload nicht bestaetigt')
              api(base+'/tracks/'+str(tid),'PATCH',{'title':f'Vormittag Moderation {i+1}','artist':'POWER RADIO','type':'moderation'})
              mods.append(tid)
          if len(set(mods))!=len(scripts): raise SystemExit('Moderationen nicht eindeutig')
          api(base+'/playlists','POST',{'title':title,'description':'Vier Stunden mit Alex und Lisa, feste Reihenfolge','shuffled':False,'color':'#F59E0B'})
          p=playlists()
          if len(p)!=1: raise SystemExit('Playlist nicht eindeutig')
          path=base+'/playlists/'+str(p[0]['id'])
          expected=[]
          mod_seconds=sum(track(m)['duration'] for m in mods)
          target=14400-mod_seconds

          # Choose a set with ~60% retained songs and ~40% genuinely new songs.
          rng=random.Random(day)
          best=None
          for _ in range(24000):
              count=rng.randint(54,68)
              keep=round(count*.60);new=count-keep
              if keep>len(old) or new>len(fresh): continue
              chosen=rng.sample(old,keep)+rng.sample(fresh,new)
              if not any(key(x) in chartkeys for x in chosen): continue
              total=sum(x['duration'] for x in chosen)
              if total<=target-1 and (best is None or total>best[0]): best=(total,chosen,keep,new)
          assert best is not None and target-120<=best[0]<target,'Cannot fill four-hour window safely'
          seconds,chosen,kept,new=best
          # Spread decades and avoid back-to-back appearances by the same artist.
          rng.shuffle(chosen)
          ordered=[]
          while chosen:
              last=norm(ordered[-1]['artist']) if ordered else None
              year=str(ordered[-1].get('release_year') or ordered[-1].get('releaseyear') or '') if ordered else ''
              era=int(year)//10 if year.isdigit() else None
              options=[x for x in chosen if norm(x['artist'])!=last]
              assert options,'Cannot separate repeated artists'
              def decade(x):
                  y=str(x.get('release_year') or x.get('releaseyear') or '')
                  return int(y)//10 if y.isdigit() else None
              alternate=[x for x in options if decade(x)!=era]
              x=rng.choice(alternate or options);ordered.append(x);chosen.remove(x)
          selected=[x['id'] for x in ordered]
          print('MUSIC VERIFIED retained',kept,'new',new,'ratio',round(kept/len(selected),3),'music seconds',seconds)
          for i,m in enumerate(mods):
              a=i*len(selected)//len(mods)
              b=(i+1)*len(selected)//len(mods)
              if i==len(mods)-1: expected.extend([*selected[a:b],m])
              else: expected.extend([m,*selected[a:b]])
          for tid in expected: api(path,'POST',{'track_id':tid})
          actual=api(path)
          print('PILOT',actual['id'],'Dauer',actual.get('duration'),'Shuffle',actual.get('shuffled'))
          print('SOLL',expected,'IST',[x['track_id'] for x in actual['entries']])
          if actual.get('shuffled') is not False or [x['track_id'] for x in actual['entries']]!=expected: raise SystemExit('Reihenfolge nicht bestaetigt')
          if not 14280<=actual.get('duration',0)<14400: raise SystemExit('Spielzeit ausserhalb Toleranz')
          assert abs(actual['duration']-(seconds+mod_seconds))<=2, 'Duration disagrees with resolved metadata'
          print('Reihenfolge und Spielzeit unter vier Stunden bestaetigt')
          print('VERIFIED TRACKS',json.dumps([dict(id=x['id'],artist=x['artist'],title=x['title'],duration=x['duration']) for x in ordered],ensure_ascii=False))
          def expand(s):
              a=[None]*168
              for e in s['entries']:
                  for i in range(e['slot'],e['slot']+e['duration']):
                      assert a[i] is None
                      a[i]=e['playlist_id']
              return a
          current=datetime.datetime.now(ZoneInfo('Europe/Berlin'))
          assert current.date()==now.date() and current.hour<10, 'Too late; previous schedule retained'
          old=api(base+'/schedule');a=expand(old);b=a.copy()
          start=current.weekday()*24+10
          known={556384}|{x['id'] for x in records(api(base+'/playlists')) if isinstance(x.get('id'),int) and str(x.get('title','')).startswith('POWER RADIO – Der Vormittag ')}
          assert all(a[i] in known for i in range(start,start+4)), 'Unexpected schedule; no overwrite'
          for i in range(start,start+4): b[i]=actual['id']
          entries=[]
          for i,v in enumerate(b):
              if v is None: continue
              if entries and i%24 and entries[-1]['playlist_id']==v and entries[-1]['slot']+entries[-1]['duration']==i: entries[-1]['duration']+=1
              else: entries.append(dict(playlist_id=v,slot=i,duration=1))
          assert expand(api(base+'/schedule'))==a
          api(base+'/schedule','PATCH',dict(base_playlist_id=old['base_playlist_id'],entries=entries))
          confirmed=api(base+'/schedule')
          if expand(confirmed)!=b or confirmed.get('base_playlist_id')!=old['base_playlist_id']:
              raise SystemExit('Schedule verification failed; manual inspection required; no further changes')
          assert all(expand(confirmed)[i]==a[i] for i in range(168) if i not in range(start,start+4))
          print('VERIFIED DAILY SHOW',day,actual['id'],'10-14; other slots unchanged')
          PY
