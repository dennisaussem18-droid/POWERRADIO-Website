name: POWER RADIO Vormittag Produktion
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/vormittag-full.yml']
permissions:
  contents: read
concurrency: power-vormittag-full
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - run: pip install edge-tts
      - name: Produce and verify pilot
        env:
          LAUTFM_TOKEN: ${{ secrets.LAUTFM_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,subprocess,time
          base='/stations/1687'
          token=os.environ['LAUTFM_TOKEN']
          def api(path,method='GET',body=None):
              req=urllib.request.Request('https://api.radioadmin.laut.fm'+path,method=method,data=json.dumps(body).encode() if body is not None else None,headers={'Authorization':'Bearer '+token,'Origin':'LautfmMCP','Accept':'application/json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
                  return json.loads(raw) if raw else None
          def records(o):
              if isinstance(o,dict):
                  yield o
                  for v in o.values(): yield from records(v)
              elif isinstance(o,list):
                  for v in o: yield from records(v)
          title='POWER RADIO – Der Vormittag'
          def playlists():
              return [x for x in records(api(base+'/playlists')) if x.get('title')==title and x.get('id')]
          if playlists(): raise SystemExit('Sendung existiert bereits')
          music=api(base+'/playlists/556376')
          extra=api(base+'/playlists/556357')
          tracks=list(dict.fromkeys([x['track_id'] for x in music['entries']]+[x['track_id'] for x in extra['entries'] if x['track_id']!=1]))
          meta={}
          for i in range(0,len(tracks),30):
              for x in records(api(base+'/tracks/'+','.join(map(str,tracks[i:i+30])))):
                  if isinstance(x.get('id'),int) and x.get('type')=='song' and isinstance(x.get('duration'),(int,float)): meta[x['id']]=x
          tracks=[t for t in tracks if t in meta]
          import re
          seen=set()
          unique=[]
          for t in tracks:
              x=meta[t]
              key=tuple(re.sub(r'[^a-z0-9]','',str(x.get(k,'')).lower()) for k in ('artist','title'))
              if key not in seen: unique.append(t);seen.add(key)
          tracks=unique
          topics=["Schön, dass ihr dabei seid. Wir begleiten euch durch den Vormittag in Düren, Jülich, Aachen und Langerwehe. Wir sind Alex und Lisa, eure digitalen Moderatoren.","Lisa hier. Welcher Song erinnert euch sofort an einen bestimmten Sommer? Musik kann uns gedanklich an ganz besondere Orte zurückbringen.","Alex hier. Ein kleiner Tipp für den Schreibtisch: Schaut zwischendurch einmal aus dem Fenster und gönnt euren Augen eine Pause.","Ob auf dem Weg zur Arbeit oder beim Einkaufen: Wir wünschen euch einen entspannten Vormittag und liefern den passenden Soundtrack.","Kennt ihr das, wenn ein Refrain den ganzen Tag im Kopf bleibt? Genau solche Ohrwürmer haben wir heute für euch dabei.","Zeit für eine kleine musikalische Zeitreise. Von Synthesizern der Achtziger bis zu modernen Dance Beats ist heute alles dabei.","Lisa fragt: Kaffee oder Tee? Egal, was in eurer Tasse ist, die nächste Portion Musik geht auf uns.","Ein Gruß an alle, die heute im Einzelhandel, in der Pflege oder im Handwerk unterwegs sind. Schön, dass wir euch begleiten dürfen.","Manchmal reicht ein guter Song, um die Stimmung zu verändern. Dreht die Musik auf, wenn es gerade passt.","Alex hier. Habt ihr schon einmal einen Lieblingssong erst Jahre nach seiner Veröffentlichung entdeckt? Gute Musik hat kein Verfallsdatum.","Ein kleiner Gedanke für heute: Auch kurze Pausen können einen langen Arbeitstag angenehmer machen.","Von der Rur bis zum Aachener Dom, wir grüßen unsere ganze Region. Hier ist Power Radio.","Lisa hier. Was war eigentlich eure erste gekaufte CD oder Schallplatte? Vielleicht ist heute ein Song aus dieser Zeit dabei.","Wenn ihr gerade unterwegs seid, kommt gut und sicher an. Wir bleiben mit euch auf Empfang.","Die Mittagspause rückt näher. Vielleicht ist jetzt Zeit für etwas Leckeres und einen Moment zum Abschalten.","Alex hier. Ein guter Refrain funktioniert oft auch dann, wenn man nicht jedes Wort versteht. Musik verbindet.","Für alle im Homeoffice: Hier kommt musikalische Gesellschaft für eure nächste Aufgabe.","Lisa hier. Manche Songs beginnen ganz ruhig und entwickeln dann eine unglaubliche Energie. Genau diese Abwechslung lieben wir.","Ein Gruß an alle, die heute früh aufgestanden sind. Ihr habt schon einen großen Teil des Tages geschafft.","Was wäre euer persönlicher Soundtrack für einen Roadtrip? Wir hätten da einige Vorschläge aus unserer Musikmischung.","Alex hier. Ein bisschen Bewegung zur Lieblingsmusik kann Spaß machen, selbst wenn es nur ein Wippen mit dem Fuß ist.","Wir machen weiter mit einem Mix aus verschiedenen Jahrzehnten. Alte Lieblingshits treffen auf jüngere Songs.","Lisa hier. Wer heute etwas Neues ausprobieren möchte, könnte einmal ein Album hören, das bisher nicht auf der eigenen Liste stand.","Ein musikalischer Gruß an alle, die gerade eine Pause machen. Genießt die nächsten Minuten.","Alex hier. Musik ist auch eine schöne Möglichkeit, mit anderen ins Gespräch zu kommen. Fragt doch mal nach ihrem Lieblingssong.","Wir nähern uns dem Nachmittag. Noch ist aber genug Zeit für eine ordentliche Portion gute Musik.","Lisa hier. Danke, dass ihr euren Vormittag mit uns verbringt. Ob laut oder leise, wir sind gerne eure Begleitung.","Alex hier. Wir wünschen euch für den Rest des Tages gute Laune und möglichst wenig Stress.","Die letzten Hits unseres Vormittags stehen an. Schön, dass ihr heute mit uns unterwegs wart.","Hier sind Alex und Lisa. Danke fürs Zuhören und einen schönen Nachmittag. Ihr hört Power Radio, mehr Musik, mehr Power."]
          scripts=[('de-DE-ConradNeural' if i%2==0 else 'de-DE-KatjaNeural',v) for i,v in enumerate(topics)]
          mods=[]
          for i,(voice,script) in enumerate(scripts):
              f=f'moderation-{i}.mp3'
              subprocess.run(['edge-tts','--voice',voice,'--text',script,'--write-media',f],check=True)
              raw=subprocess.check_output(['curl','--silent','--show-error','--fail-with-body','--max-time','120','-H','Authorization: Bearer '+token,'-H','Origin: LautfmMCP','-H','Accept: application/json','-F',f'track=@{f};type=audio/mpeg','-F','private=true','https://api.radioadmin.laut.fm'+base+'/tracks'])
              pending=int(json.loads(raw)['id'])
              tid=None
              for _ in range(30):
                  try:
                      found=[x['id'] for x in records(api(base+'/tracks/'+str(pending))) if isinstance(x.get('id'),int) and x['id']>0 and x.get('private') is True and x.get('duration',0)>0]
                      if len(set(found))==1: tid=found[0];break
                  except Exception: pass
                  time.sleep(10)
              if tid is None: raise SystemExit('Upload nicht bestaetigt')
              api(base+'/tracks/'+str(tid),'PATCH',{'title':f'Vormittag Moderation {i+1}','artist':'POWER RADIO','type':'moderation'})
              mods.append(tid)
          if len(set(mods))!=len(scripts): raise SystemExit('Moderationen nicht eindeutig')
          api(base+'/playlists','POST',{'title':title,'description':'Vier Stunden mit Alex und Lisa, feste Reihenfolge','shuffled':False,'color':'#F59E0B'})
          p=playlists()
          if len(p)!=1: raise SystemExit('Playlist nicht eindeutig')
          path=base+'/playlists/'+str(p[0]['id'])
          expected=[]
          mod_seconds=sum(api(base+'/tracks/'+str(m)).get('duration',0) for m in mods)
          target=14400-mod_seconds
          selected=[]
          seconds=0
          for t in tracks:
              if seconds>=target: break
              selected.append(t);seconds+=meta[t]['duration']
          if seconds<target-120: raise SystemExit('Nicht genug Musik')
          for i,m in enumerate(mods):
              a=i*len(selected)//len(mods)
              b=(i+1)*len(selected)//len(mods)
              if i==len(mods)-1: expected.extend([*selected[a:b],m])
              else: expected.extend([m,*selected[a:b]])
          for tid in expected: api(path,'POST',{'track_id':tid})
          actual=api(path)
          print('PILOT',actual['id'],'Dauer',actual.get('duration'),'Shuffle',actual.get('shuffled'))
          print('SOLL',expected,'IST',[x['track_id'] for x in actual['entries']])
          if actual.get('shuffled') is not False or [x['track_id'] for x in actual['entries']]!=expected: raise SystemExit('Reihenfolge nicht bestaetigt')
          if not 14280<=actual.get('duration',0)<=14820: raise SystemExit('Spielzeit ausserhalb Toleranz')
          print('Reihenfolge und vier Stunden bestaetigt; Sendeplan unveraendert')
          PY
