name: Regionalnachrichten Sendeplan-Prüfung
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Sendeplan und Playlistnamen lesen
        env:
          LAUTFM_TOKEN: ${{ secrets.LAUTFM_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          def get(path):
              req=urllib.request.Request('https://api.radioadmin.laut.fm/stations/1687/'+path,headers={'Authorization':'Bearer '+os.environ['LAUTFM_TOKEN'],'Origin':'LautfmMCP','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          def clean(o):
              if isinstance(o,list): return [clean(x) for x in o]
              if isinstance(o,dict): return {k:clean(v) for k,v in o.items() if k in ('id','title','name','description','playlist_id','base_playlist_id','slot','duration','entries','playlists','schedule','type','live','start','end','data','weekday','start_time','end_time')}
              return o
          print('Sendeplan:',json.dumps(clean(get('schedule')),ensure_ascii=False))
          print('Playlists:',json.dumps(clean(get('playlists')),ensure_ascii=False))
          PY
