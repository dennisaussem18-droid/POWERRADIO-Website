name: POWER RADIO Hoerspiel Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hoerspiel:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Software installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install chatterbox-tts requests pydub huggingface_hub

      - name: Referenzstimme herunterladen
        run: |
          mkdir -p output

          python - <<'PY'
          import requests
          import subprocess

          url = "https://datasets-server.huggingface.co/rows"
          params = {
              "dataset": "Thorsten-Voice/TV-44kHz-Full",
              "config": "TV-2022.10-Neutral",
              "split": "train",
              "offset": 0,
              "length": 30
          }

          r = requests.get(url, params=params, timeout=120)
          r.raise_for_status()

          rows = [x["row"] for x in r.json()["rows"]]
          rows = sorted(
              rows,
              key=lambda x: x.get("durationSeconds", 0),
              reverse=True
          )

          audio = rows[0]["audio"][0]["src"]
          r = requests.get(audio, timeout=120)
          r.raise_for_status()

          with open("reference_original.wav", "wb") as f:
              f.write(r.content)

          subprocess.run([
              "ffmpeg", "-y",
              "-i", "reference_original.wav",
              "-af", "loudnorm",
              "-ar", "24000",
              "-ac", "1",
              "reference.wav"
          ], check=True)
          PY

      - name: Hoerspiel produzieren
        run: |
          cat > production.py <<'PY'
          import torch, torchaudio, re
          from huggingface_hub import HfApi, hf_hub_download
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS
          from pydub import AudioSegment, effects
          from pydub.generators import Sine, WhiteNoise
          torch.set_num_threads(4)
          repo = "Fraunhofer-IEM/designed-voices-de-en"
          files = HfApi().list_repo_files(repo, repo_type="dataset")
          candidates = [p for p in files if p.lower().endswith(".wav") and "reference" in p.lower()]
          males = [p for p in candidates if re.search(r'de-m', p)]
          females = [p for p in candidates if re.search(r'de-f', p)]
          assert len(males) >= 2 and females, f"Keine passenden Referenzen: {candidates[:20]}"
          voices = {"Erzaehler": "reference.wav"}
          for role, path in zip(["Dupin","Kommissar","Zeugin"], [males[0],males[-1],females[0]]):
              voices[role] = hf_hub_download(repo,path,repo_type="dataset")
          model = ChatterboxMultilingualTTS.from_pretrained(device="cpu")
          def silence(ms):
              return AudioSegment.silent(duration=ms,frame_rate=24000)
          def noise(ms, cutoff, gain):
              return WhiteNoise().to_audio_segment(duration=ms).low_pass_filter(cutoff).fade_out(min(ms,500)).apply_gain(gain)
          scene = silence(3000)
          lines = [
              ("Erzaehler","POWER RADIO präsentiert die Kriminacht. Ein Hörspiel mit künstlich erzeugten Stimmen."),
              ("Erzaehler","Der Doppelmord in der Rue Morgue. Nach Edgar Allan Poe. Paris lag in tiefem Schlaf. Doch plötzlich durchbrach ein Schrei die Stille der Nacht."),
              ("Donner",""),
              ("Schritte",""),
              ("Tuer",""),
              ("Kommissar","Monsieur Dupin! Endlich sind Sie da. Wir stehen vor einem vollkommenen Rätsel."),
              ("Dupin","Erzählen Sie mir genau, was passiert ist. Lassen Sie keine Einzelheit aus."),
              ("Kommissar","Die Tür war von innen verschlossen. Niemand konnte das Zimmer verlassen."),
              ("Zeugin","Ich habe Schreie gehört! Zwei Stimmen. Eine davon klang überhaupt nicht menschlich!"),
              ("Dupin","Nicht menschlich, sagen Sie? Das ist ausgesprochen interessant."),
              ("Donner",""),
              ("Erzaehler","Dupin trat langsam an das Fenster. Sein Blick blieb an einem kleinen Gegenstand auf dem Fensterbrett hängen."),
              ("Kommissar","Haben Sie etwas entdeckt?"),
              ("Dupin","Vielleicht. Herr Kommissar, ich glaube, wir suchen nach dem falschen Täter."),
              ("Erzaehler","Ein Geheimnis, das ganz Paris erschüttern sollte, nahm seinen Anfang."),
              ("Erzaehler","Stimmreferenzen von Fraunhofer I E M, Creative Commons Namensnennung vier Punkt null, und Thorsten Voice.")
          ]
          for role, text in lines:
              if role == "Donner":
                  scene += noise(2500,120,-14)
              elif role == "Schritte":
                  for _ in range(6):
                      scene += noise(140,250,-14)+silence(370)
              elif role == "Tuer":
                  scene += noise(450,700,-14)
              else:
                  print(role,text,flush=True)
                  wav = model.generate(text,language_id="de",audio_prompt_path=voices[role],exaggeration=0.5,cfg_weight=0.5)
                  torchaudio.save("speech.wav",wav.cpu(),model.sr)
                  scene += effects.normalize(AudioSegment.from_wav("speech.wav")).apply_gain(-3)
              scene += silence(850)
          scene += silence(5000)
          duration = len(scene)
          music = Sine(55).to_audio_segment(duration=duration).overlay(Sine(82.41).to_audio_segment(duration=duration).apply_gain(-6)).apply_gain(-34).fade_in(3000).fade_out(5000)
          rain = WhiteNoise().to_audio_segment(duration=duration).high_pass_filter(1500).low_pass_filter(6500).apply_gain(-35).fade_in(2000).fade_out(4000)
          effects.normalize(scene.overlay(music).overlay(rain),headroom=1).export("output/POWER_RADIO_Kriminacht_Demo.mp3",format="mp3",bitrate="192k")
          with open("output/LIZENZEN.txt","w") as f:
              f.write("Thorsten-Voice: CC0\nFraunhofer IEM: designed-voices-de-en, CC BY 4.0, used for speech synthesis\nhttps://creativecommons.org/licenses/by/4.0/\nhttps://huggingface.co/datasets/"+repo+"\nMusik und Effekte: synthetisch erzeugt\nText: freie Poe-Bearbeitung\n")
          PY
          python production.py

      - name: Hoerspiel bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: POWER-RADIO-Kriminacht-Demo
          path: output/
