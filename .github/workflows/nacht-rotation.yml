name: Nachtprogramm Stundenrotation
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/nacht-rotation.yml']
permissions:
  contents: read
concurrency: nacht-rotation
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - env:
          LAUTFM_TOKEN: ${{ secrets.LAUTFM_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,datetime,random,unicodedata,re,time
          from zoneinfo import ZoneInfo
          def api(path,method='GET',body=None):
              req=urllib.request.Request('https://api.radioadmin.laut.fm/stations/1687'+path,method=method,data=json.dumps(body).encode() if body is not None else None,headers={'Authorization':'Bearer '+os.environ['LAUTFM_TOKEN'],'Origin':'LautfmMCP','Accept':'application/json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read()
                  return json.loads(raw) if raw else None
          def records(o):
              if isinstance(o,dict):
                  yield o
                  for v in o.values(): yield from records(v)
              elif isinstance(o,list):
                  for v in o: yield from records(v)
          def playlists(): return {x['title']:x['id'] for x in records(api('/playlists')) if x.get('title') and x.get('id')}
          def norm(s):
              return re.sub(r'[^a-z0-9]','',unicodedata.normalize('NFKD',str(s).lower()).encode('ascii','ignore').decode())
          catalog=["ABBA|Dancing Queen;Queen|Don't Stop Me Now;Bee Gees|Stayin' Alive;Fleetwood Mac|Go Your Own Way;Earth Wind & Fire|September;Gloria Gaynor|I Will Survive;Donna Summer|Hot Stuff;Chic|Le Freak;Electric Light Orchestra|Mr. Blue Sky;Elton John|Rocket Man;David Bowie|Heroes;Supertramp|The Logical Song;Blondie|Heart of Glass;Toto|Hold the Line;Boston|More Than a Feeling;The Police|Roxanne;Rod Stewart|Da Ya Think I'm Sexy;Boney M.|Rasputin;The Rolling Stones|Miss You;Billy Joel|Piano Man;Stevie Wonder|Superstition;The Jacksons|Blame It on the Boogie;Kiss|I Was Made for Lovin' You;Gerry Rafferty|Baker Street;10cc|I'm Not in Love;ABBA|Mamma Mia;Queen|We Will Rock You;Village People|Y.M.C.A.;Sister Sledge|We Are Family;The Knack|My Sharona","Michael Jackson|Billie Jean;Madonna|Like a Prayer;a-ha|Take On Me;Depeche Mode|Just Can't Get Enough;Toto|Africa;Bon Jovi|Livin' on a Prayer;Whitney Houston|I Wanna Dance with Somebody;Eurythmics|Sweet Dreams;Nena|99 Luftballons;Tears for Fears|Everybody Wants to Rule the World;Duran Duran|Hungry Like the Wolf;Rick Astley|Never Gonna Give You Up;Europe|The Final Countdown;Cyndi Lauper|Girls Just Want to Have Fun;Phil Collins|In the Air Tonight;Bruce Springsteen|Dancing in the Dark;Bryan Adams|Summer of '69;Survivor|Eye of the Tiger;Kim Wilde|Kids in America;Pet Shop Boys|West End Girls;Soft Cell|Tainted Love;New Order|Blue Monday;INXS|Need You Tonight;U2|With or Without You;Simple Minds|Don't You Forget About Me;George Michael|Faith;Roxette|The Look;Queen|Radio Ga Ga;Falco|Rock Me Amadeus;Katrina and the Waves|Walking on Sunshine","Roxette|Joyride;Backstreet Boys|Everybody;Snap!|Rhythm Is a Dancer;Bryan Adams|Everything I Do I Do It for You;Oasis|Wonderwall;Blur|Song 2;Spice Girls|Wannabe;Britney Spears|Baby One More Time;Haddaway|What Is Love;Corona|The Rhythm of the Night;Culture Beat|Mr. Vain;Ace of Base|All That She Wants;Dr. Alban|It's My Life;Scatman John|Scatman;Nirvana|Smells Like Teen Spirit;R.E.M.|Losing My Religion;The Cranberries|Zombie;No Doubt|Don't Speak;Robbie Williams|Angels;Cher|Believe;TLC|No Scrubs;Coolio|Gangsta's Paradise;Will Smith|Men in Black;Fugees|Killing Me Softly;Natalie Imbruglia|Torn;Sixpence None the Richer|Kiss Me;Gala|Freed from Desire;Robert Miles|Children;Liquido|Narcotic;Die Fantastischen Vier|MfG","Rihanna|Umbrella;P!nk|So What;Coldplay|Viva la Vida;Robbie Williams|Feel;Kylie Minogue|Can't Get You Out of My Head;Lady Gaga|Poker Face;Beyoncé|Crazy in Love;Outkast|Hey Ya!;Gnarls Barkley|Crazy;The Killers|Mr. Brightside;The Black Eyed Peas|I Gotta Feeling;Shakira|Whenever Wherever;Nelly Furtado|Say It Right;Justin Timberlake|SexyBack;Katy Perry|Hot n Cold;Linkin Park|In the End;Green Day|Boulevard of Broken Dreams;Snow Patrol|Chasing Cars;Keane|Somewhere Only We Know;James Blunt|You're Beautiful;Maroon 5|This Love;Amy Winehouse|Rehab;Mark Ronson|Valerie;Madcon|Beggin;Eric Prydz|Call on Me;Cascada|Everytime We Touch;Guru Josh Project|Infinity 2008;Peter Fox|Haus am See;Wir sind Helden|Denkmal;Sportfreunde Stiller|Ein Kompliment","Avicii|Wake Me Up;Adele|Rolling in the Deep;Bruno Mars|Locked Out of Heaven;David Guetta|Titanium;Daft Punk|Get Lucky;Pharrell Williams|Happy;Taylor Swift|Shake It Off;Ed Sheeran|Shape of You;Imagine Dragons|Radioactive;OneRepublic|Counting Stars;Sia|Chandelier;Clean Bandit|Rather Be;Calvin Harris|Feel So Close;Swedish House Mafia|Don't You Worry Child;Robin Schulz|Sugar;Felix Jaehn|Ain't Nobody;Lost Frequencies|Are You with Me;Kygo|Firestone;Major Lazer|Lean On;Justin Bieber|Sorry;The Weeknd|Can't Feel My Face;Dua Lipa|New Rules;Portugal. The Man|Feel It Still;George Ezra|Shotgun;Passenger|Let Her Go;Milky Chance|Stolen Dance;Mark Forster|Chöre;Andreas Bourani|Auf uns;Clueso|Gewinner;Walk the Moon|Shut Up and Dance","Dua Lipa|Levitating;The Weeknd|Save Your Tears;Ed Sheeran|Bad Habits;Miley Cyrus|Flowers;Harry Styles|As It Was;Olivia Rodrigo|Good 4 U;Glass Animals|Heat Waves;Imagine Dragons|Bones;OneRepublic|I Ain't Worried;David Guetta|I'm Good (Blue);Purple Disco Machine|Hypnotized;Elton John|Cold Heart;Tiësto|The Business;Meduza|Paradise;Joel Corry|Head & Heart;Topic|Breaking Me;Alok|Deep Down;Lost Frequencies|Where Are You Now;Lewis Capaldi|Forget Me;Tate McRae|Greedy;Sabrina Carpenter|Espresso;Benson Boone|Beautiful Things;Hozier|Too Sweet;Billie Eilish|Birds of a Feather;Chappell Roan|Good Luck Babe;Shaboozey|A Bar Song (Tipsy);Lady Gaga|Abracadabra;Alex Warren|Ordinary;Lola Young|Messy;ROSÉ|APT."]
          pools=[]
          seen=set()
          for group in catalog:
              pool=[]
              for pair in group.split(';'):
                  artist,title=pair.split('|',1)
                  q=urllib.parse.urlencode(dict(artist=artist,title=title,type='song'))
                  matches=[x for x in records(api('/tracks?'+q)) if x.get('type')=='song' and not x.get('private') and isinstance(x.get('id'),int) and 120<=x.get('duration',0)<=420 and norm(x.get('artist',''))==norm(artist) and norm(x.get('title',''))==norm(title) and x['id'] not in seen]
                  if matches:
                      x=matches[0];pool.append(x['id']);seen.add(x['id'])
                  else: print('Unavailable exact hit',artist,title,flush=True)
              assert len(pool)>=12, ('Insufficient known hits',len(pool))
              random.shuffle(pool);pools.append(pool)
          ids=[]
          previous=None
          for i in range(max(map(len,pools))):
              order=[j for j,p in enumerate(pools) if i<len(p)]
              random.shuffle(order)
              if len(order)>1 and order[0]==previous: order[0],order[1]=order[1],order[0]
              for j in order: ids.append(pools[j][i])
              if order: previous=order[-1]
          print('VERIFIED curated hits',len(ids),flush=True)
          special=[1,19896219,19893862,19849290,20662554,20551604]
          meta={}
          for i in range(0,len(ids+special),30):
              for x in records(api('/tracks/'+','.join(map(str,(ids+special)[i:i+30])))):
                  if isinstance(x.get('id'),int) and x.get('duration',0)>0: meta[x['id']]=x
          assert all(t in meta for t in ids+special)
          assert meta[1]['type']=='news'
          assert all(meta[t].get('own') for t in special[1:])
          blocks=[]
          cursor=0
          for n in range(18):
              seq=[1,19896219]
              seconds=sum(meta[t]['duration'] for t in seq)
              count=0
              while seconds<3600:
                  t=ids[cursor%len(ids)];cursor+=1
                  if t in seq: continue
                  if any(meta[s].get('artist')==meta[t].get('artist') for s in seq[-5:] if s not in special): continue
                  seq.append(t);seconds+=meta[t]['duration'];count+=1
                  if count in (4,8,12,16):
                      j={4:19893862,8:20662554,12:19849290,16:20551604}[count]
                      seq.append(j);seconds+=meta[j]['duration']
              assert 20662554 in seq and len(seq)==len(set(seq))
              title=f'Gemischt in die Nacht – Radiohits Stunde {n+1:02}'
              pid=playlists().get(title)
              if not pid:
                  api('/playlists','POST',dict(title=title,color='#F1C40F',description='Nachrichten und Wetter zum Stundenbeginn, eigene Jingles und Weihnachtswunder, Musikmix 1970–2026',shuffled=False))
                  pid=playlists()[title]
              path='/playlists/'+str(pid)
              old=[x['track_id'] for x in api(path)['entries']]
              assert old==seq[:len(old)], 'Existing block differs'
              for t in seq[len(old):]: api(path,'POST',dict(track_id=t))
              actual=api(path)
              assert actual['shuffled'] is False and [x['track_id'] for x in actual['entries']]==seq and actual['duration']>=3600
              blocks.append(pid)
              print('VERIFIED BLOCK',n+1,pid,actual['duration'],flush=True)
          def expand(s):
              a=[None]*168
              for e in s['entries']:
                  for i in range(e['slot'],e['slot']+e['duration']):
                      assert a[i] is None
                      a[i]=e['playlist_id']
              return a
          old=api('/schedule');a=expand(old);b=a.copy()
          slots=[i for i,v in enumerate(a) if v in {520023,*range(556424,556442),*range(556444,556462)}]
          assert slots
          for n,i in enumerate(slots): b[i]=blocks[n%len(blocks)]
          entries=[]
          for i,v in enumerate(b):
              if v is None: continue
              if entries and i%24 and entries[-1]['playlist_id']==v and entries[-1]['slot']+entries[-1]['duration']==i: entries[-1]['duration']+=1
              else: entries.append(dict(playlist_id=v,slot=i,duration=1))
          assert expand(api('/schedule'))==a
          api('/schedule','PATCH',dict(base_playlist_id=old['base_playlist_id'],entries=entries))
          assert expand(api('/schedule'))==b
          print('VERIFIED NIGHT SCHEDULE',slots,'other slots unchanged')
          PY
