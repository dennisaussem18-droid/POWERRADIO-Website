name: Jahreschartshow Teil 2
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/chartshow-teil2.yml']
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - run: pip install edge-tts beautifulsoup4
      - env:
          LAUTFM_TOKEN: ${{ secrets.LAUTFM_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,subprocess,time,re,unicodedata,uuid
          from bs4 import BeautifulSoup
          base='/stations/1687'
          token=os.environ['LAUTFM_TOKEN']
          def api(path,method='GET',body=None):
              req=urllib.request.Request('https://api.radioadmin.laut.fm'+base+path,method=method,data=json.dumps(body).encode() if body is not None else None,headers={'Authorization':'Bearer '+token,'Origin':'LautfmMCP','Accept':'application/json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
                  return json.loads(raw) if raw else None
          def records(o):
              if isinstance(o,dict):
                  yield o
                  for v in o.values(): yield from records(v)
              elif isinstance(o,list):
                  for v in o: yield from records(v)
          def norm(s):
              return re.sub('[^a-z0-9]','',unicodedata.normalize('NFKD',s.lower()).encode('ascii','ignore').decode())
          rows={}
          for y in range(2009,2018):
              url=f'https://www.chartsurfer.de/musik/single-charts-deutschland/jahrescharts/hits-{y}/top-100'
              html=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=60).read()
              soup=BeautifulSoup(html,'html.parser')
              # Extract ranked rows from visible text, independent of table/div markup.
              lines=[s.strip() for s in soup.stripped_strings if s.strip()]
              for i in range(len(lines)-4):
                  rank,title,artist,points,date=lines[i:i+5]
                  if re.fullmatch(r'\d{1,3}\.?',rank) and re.fullmatch(r'\d[\d.,]*',points) and re.fullmatch(r'\d{2}\.\d{2}\.\d{4}',date):
                      n=int(rank.rstrip('.'))
                      if 1<=n<=100: rows.setdefault((y,n),(artist,title))
              if not all((y,n) in rows for n in range(1,16)):
                  print('Source sample',lines[:500],flush=True)
              assert all((y,n) in rows for n in range(1,16)), ('Chart parsing failed',y)
              print('Verified source rows',y,[(n,rows[y,n]) for n in range(1,16)],flush=True)
          filler={k:v for k,v in rows.items() if k[1]>15}
          rows={k:v for k,v in rows.items() if k[1]<=15}
          selected=[]
          used=set()
          for (y,n),(a,t) in sorted(rows.items(),key=lambda x:(x[0][0],-x[0][1])):
              candidates=[]
              for artist in [a,re.split(r' feat\.? | ft\.? | pres\.? ',a,flags=re.I)[0]]:
                  try:
                      for x in records(api('/tracks?'+urllib.parse.urlencode({'artist':artist,'title':t,'type':'song'}))):
                          if x.get('type')=='song' and x.get('duration',0)>60 and x.get('id') not in used and norm(t)==norm(x.get('title','')) and norm(artist) in norm(x.get('artist','')): candidates.append(x)
                  except Exception as e: print('search error',y,n,str(e))
                  if candidates: break
              if not candidates:
                  print('Missing',y,n,a,t);continue
              x=candidates[0];used.add(x['id']);selected.append((y,n,x))
          assert len(selected)>=90, len(selected)
          print('Music duration',sum(x['duration'] for y,n,x in selected))
          title='POWER RADIO – Jahreschartshow Teil 2 (2009–2017)'
          assert not any(x.get('title')==title for x in records(api('/playlists'))), 'Already exists'
          def mod(script,i):
              f=f'chart2-{uuid.uuid4().hex}-{i:03}.mp3'
              subprocess.run(['edge-tts','--voice','de-DE-ConradNeural' if i%2==0 else 'de-DE-KatjaNeural','--rate=+5%','--text',script,'--write-media',f],check=True)
              raw=subprocess.check_output(['curl','-sS','--fail-with-body','--max-time','120','-H','Authorization: Bearer '+token,'-H','Origin: LautfmMCP','-H','Accept: application/json','-F',f'track=@{f};type=audio/mpeg','-F','private=true','https://api.radioadmin.laut.fm'+base+'/tracks'])
              pending=int(json.loads(raw)['id'])
              print('Upload pending',i,pending,flush=True)
              for attempt in range(90):
                  try:
                      found=[x['id'] for x in records(api('/tracks/'+str(pending))) if isinstance(x.get('id'),int) and x['id']>0 and x.get('private') is True and x.get('duration',0)>0]
                      if len(set(found))==1:
                          tid=found[0];break
                  except Exception as e:
                      if attempt%6==0: print('Polling',i,pending,str(e),flush=True)
                  time.sleep(10)
              else: raise RuntimeError(f'Upload not confirmed: moderation {i}, pending {pending}')
              api('/tracks/'+str(tid),'PATCH',{'title':f'Jahreschartshow Moderation {i:03}','artist':'POWER RADIO','type':'moderation'})
              return tid
          expected=[mod('Herzlich willkommen zur großen Jahreschartshow auf Power Radio! Im zweiten Teil reisen wir durch die Jahre zweitausendneun bis zweitausendsiebzehn. Grundlage ist die historische Top hundert Auswertung von Chartsurfer. Nicht verfügbare Titel lassen wir aus. Die Moderationen wurden mithilfe künstlicher Intelligenz erstellt. Viel Spaß bei unserer musikalischen Zeitreise!',0)]
          year=None
          for i,(y,n,x) in enumerate(selected,1):
              prefix=f'Wir reisen ins Jahr {y}. ' if y!=year else ''
              year=y
              intro= 'Und jetzt die Spitze des Jahrgangs! ' if n==1 else ''
              expected.extend([mod(prefix+intro+f'Platz {n}: {x["artist"]} mit {x["title"]}.',i),x['id']])
          expected.append(mod('Das war der Countdown unseres zweiten Teils, von zweitausendneun bis zweitausendsiebzehn. Jetzt gibt es noch weitere Hits aus diesen Jahren.',len(selected)+1))
          seconds=sum(x['duration'] for y,n,x in selected)
          for tid in expected:
              if tid not in used: seconds+=api('/tracks/'+str(tid))['duration']
          assert seconds<=32400, 'Show exceeds nine hours'
          for (y,n),(a,t) in sorted(filler.items(),key=lambda z:(z[0][1],z[0][0])):
              if seconds>=32400: break
              artist=re.split(r' feat\.? | ft\.? ',a,flags=re.I)[0]
              for x in records(api('/tracks?'+urllib.parse.urlencode(dict(artist=artist,title=t,type='song')))):
                  if x.get('type')=='song' and not x.get('private') and 90<=x.get('duration',0)<=420 and x.get('id') not in used and norm(t)==norm(x.get('title','')) and norm(artist) in norm(x.get('artist','')):
                      expected.append(x['id']);used.add(x['id']);seconds+=x['duration'];break
          assert 32400<=seconds<=32820, seconds
          assert len(set(expected))==len(expected)
          api('/playlists','POST',{'title':title,'description':'Chartsurfer Top-100-Auswertung 2009–2017; keine offiziellen Verkaufscharts. Nicht verfügbare Titel ausgelassen. KI-Moderation.','shuffled':False,'color':'#F59E0B'})
          p=[x for x in records(api('/playlists')) if x.get('title')==title and x.get('id')]
          assert len(p)==1
          path='/playlists/'+str(p[0]['id'])
          for tid in expected: api(path,'POST',{'track_id':tid})
          actual=api(path)
          assert actual['shuffled'] is False and [x['track_id'] for x in actual['entries']]==expected
          assert 32400<=actual['duration']<=32820
          print('VERIFIED CHARTSHOW 2',actual['id'],actual['duration'],len(selected),'ranked songs; schedule unchanged')
          PY
