name: Nachtprogramm Musikpool und Nachrichten vorbereiten
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/night-mix.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - env:
          LAUTFM_TOKEN: ${{ secrets.LAUTFM_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,random,re,collections
          def api(path,method='GET',body=None):
              req=urllib.request.Request('https://api.radioadmin.laut.fm/stations/1687'+path,method=method,data=json.dumps(body).encode() if body is not None else None,headers={'Authorization':'Bearer '+os.environ['LAUTFM_TOKEN'],'Origin':'LautfmMCP','Accept':'application/json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  raw=r.read()
                  return json.loads(raw) if raw else None
          def records(o):
              if isinstance(o,dict):
                  yield o
                  for v in o.values(): yield from records(v)
              elif isinstance(o,list):
                  for v in o: yield from records(v)
          def norm(s): return re.sub(r'[^a-z0-9]','',str(s).lower())
          old=api('/playlists/520023')
          assert 'nacht' in norm(old['title'])
          print('Current night settings', {k:v for k,v in old.items() if k not in ('entries','tracks')})
          news=api('/tracks/1')
          print('News metadata',news)
          assert news.get('duration',0)>0
          pool=collections.defaultdict(list)
          seen=set()
          for pid in (520023,520041,117360,518282,519969,518280,556357,556376,556414):
              for x in records(api('/playlists/'+str(pid)+'/tracks')):
                  y=str(x.get('release_year') or x.get('releaseyear') or '')
                  if not y.isdigit() or not 1970<=int(y)<=2026 or x.get('type')!='song' or not 100<=x.get('duration',0)<=420: continue
                  key=(norm(x.get('artist')),norm(x.get('title')))
                  if not all(key) or key in seen: continue
                  if any(g in str(x.get('genre','')).lower() for g in ('schlager','volksmusik','ballermann')): continue
                  seen.add(key);pool[int(y)//10*10].append(x)
          print('Decade counts',{k:len(v) for k,v in pool.items()})
          assert len(seen)>=100
          for v in pool.values(): random.shuffle(v)
          pattern=[1980,2020,1970,2000,1990,2010]
          selected=[]
          last=''
          while len(selected)<240:
              progress=False
              for era in pattern:
                  v=pool[era]
                  idx=next((i for i,x in enumerate(v) if norm(x['artist'])!=last),None)
                  if idx is None: continue
                  x=v.pop(idx);selected.append(x);last=norm(x['artist']);progress=True
              if not progress: break
          assert len(selected)>=100
          title='Gemischt in die Nacht – neuer Musikmix (Vorbereitung)'
          assert not any(x.get('title')==title for x in records(api('/playlists')))
          api('/playlists','POST',{'title':title,'color':'#E9C000','shuffled':False,'description':'Jahrzehnte im Wechsel; Nachrichtenintegration wird separat eingerichtet.'})
          p=[x for x in records(api('/playlists')) if x.get('title')==title and x.get('id')]
          assert len(p)==1
          path='/playlists/'+str(p[0]['id'])
          for x in selected: api(path,'POST',{'track_id':x['id']})
          actual=api(path)
          assert [x['track_id'] for x in actual['entries']]==[x['id'] for x in selected] and actual['shuffled'] is False
          print('VERIFIED',actual['id'],len(selected),actual['duration'],'schedule unchanged')
          PY
